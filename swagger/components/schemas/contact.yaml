type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  name:
    type: string
    description: Contact name
    example: Victor
  phoneNumber:
    type: string
    description: Contact phoneNumber
    example: '+380987867668'
  contactType:
    type: string
    description: Contact contactType
    enum: ['work', 'home', 'personal']
    default: 'personal'
    example: work
  userId:
    type: string
    description: Contact userId
    example: 68dcdfa0348827d943a8d029
  createdAt:
    type: string
    description: Contact createdAt
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    description: Contact updatedAt
    format: date-time
    example: 2025-10-02T12:27:51.374+00:00
